version: '3.4'
services:
  bot:
    image: ${DOCKER_REGISTRY-}stparkingbot
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - database
    restart: always
    environment:
      HTTP_PORT: $HTTP_PORT
      NODE_ENV: $NODE_ENV
      APP_HOST: $APP_HOST
      LOG_DIRECTORY_PATH: $LOG_DIRECTORY_PATH
      POSTGRES_HOST: $POSTGRES_HOST
      POSTGRES_PORT: $POSTGRES_PORT
      POSTGRES_USERNAME: $POSTGRES_USERNAME
      POSTGRES_DATABASE: $POSTGRES_DATABASE
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      TELEGRAM_BOT_TOKEN: $TELEGRAM_BOT_TOKEN
      TELEGRAM_BOT_WEBHOOK_URL: $TELEGRAM_BOT_WEBHOOK_URL
      TWILIO_ACCOUNT_SID: $TWILIO_ACCOUNT_SID
      TWILIO_AUTH_TOKEN: $TWILIO_AUTH_TOKEN
    volumes:
      - ./:/app/
      - /app/node_modules
    ports:
      - $HTTP_PORT:$HTTP_PORT
    networks:
      main:
        aliases:
          - bot
  database:
    image: postgres:14
    ports:
      - $POSTGRES_PORT:$POSTGRES_PORT
    volumes:
      - pg:/var/data/postgres
    environment:
      POSTGRES_USER: $POSTGRES_USERNAME
      POSTGRES_DB: $POSTGRES_DATABASE
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    networks:
      main:
        aliases:
          - database
  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped
    command:
      - 'start'
      - '--all'
      - '--config'
      - '/etc/ngrok/ngrok.yml'
    environment:
      NGROK_AUTHTOKEN: $NGROK_AUTHTOKEN
    ports:
      - 4040:4040
    volumes:
      - ./docker/ngrok:/etc/ngrok
    networks:
      main:
        aliases:
          - ngrok

networks:
  main:

volumes:
  pg:
